  .list { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border-radius: 15px; border: 1px solid #eee; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .card-header { padding: 15px; background: var(--rose-light); border-bottom: 1px solid var(--rose); }
  .card-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; }
  .card-body { padding: 15px; font-size: 14px; line-height: 1.6; }
  .btn-copy { width: 100%; padding: 15px; background: var(--rose); color: white; border: none; font-weight: 600; cursor: pointer; }
  .btn-copy.copied { background: #1a7a4a; }
  .actions { display: flex; gap: 10px; padding: 15px; background: #f9f9f9; }
  .btn-confirm { flex: 1; padding: 10px; border: 1px solid var(--rose); border-radius: 5px; cursor: pointer; font-weight: 600; }
  .btn-yes { background: var(--rose); color: white; }
  .btn-no { background: white; color: var(--rose); }
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 100; align-items: center; justify-content: center; }

function generarMensaje(nombre, pases, index) {
  const shortName = nombre.split(' ')[0];
  const urlConfirmacion = `${WEB_CONFIRMACION}?id=${index}`;
  
  return `Hola, estimado(a) *${shortName}* 🤍

Te escribe *Natalia Rodas*, wedding planner de Jenny & Rafael.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 18 de abril de 2026
📍 Lambayeque, Chiclayo

Jenny y Rafael han reservado *${pases > 1 ? pases + ' pases' : '1 pase'}* exclusivamente para ti.

Te pedimos gentilmente confirmar tu asistencia hasta el día *miércoles 08 de abril*, ingresando al siguiente link:
${urlConfirmacion}

Con cariño,
*Natalia Rodas*
_Wedding Planner · Boda Jenny & Rafael_`;
}

function renderCards(lista) {
  const container = document.getElementById('lista');
  container.innerHTML = lista.map(([idx, nombre, cel, pases]) => `
    <div class="card">
      <div class="card-header">
        <div class="card-name">${nombre}</div>
        <div style="font-size:11px; color: var(--rose)">${pases > 1 ? pases + ' pases' : '1 pase'}</div>
      </div>
      <div class="card-body">
        <div style="white-space: pre-wrap; background: #fdf8f5; padding: 10px; border-radius: 5px; margin-bottom:10px;">${generarMensaje(nombre, pases, idx)}</div>
        <button class="btn-copy" onclick="copiar(${idx}, this)">📋 Copiar para WhatsApp</button>
      </div>
      <div class="actions">
        <button class="btn-confirm btn-yes" onclick="registrar(${idx}, 'Sí confirmo')">Confirmar Asistencia</button>
        <button class="btn-confirm btn-no" onclick="registrar(${idx}, 'No asisto')">Declinar</button>
      </div>
    </div>
  `).join('');
}

async function registrar(idx, respuesta) {
  const invitado = invitados[idx];
  const loader = document.getElementById('loading');
  loader.style.display = 'flex';

  const payload = {
    nombre: invitado[0],
    pases: invitado[2],
    respuesta: respuesta
  };

  try {
    const response = await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-cache',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    alert(`¡Gracias! Se registró: ${respuesta} para ${invitado[0]}`);
  } catch (error) {
    alert("Error al conectar con el servidor.");
  } finally {
    loader.style.display = 'none';
  }
}

function copiar(idx, btn) {
  const [nombre,, pases] = invitados[idx];
  const texto = generarMensaje(nombre, pases, idx);
  navigator.clipboard.writeText(texto).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ ¡Copiado!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 Copiar para WhatsApp'; }, 2000);
  });
}

function filtrar(q) {
  const term = q.toLowerCase();
  const filtrados = invitados.map((inv, i) => [i, ...inv]).filter(i => i[1].toLowerCase().includes(term));
  renderCards(filtrados);
}

renderCards(invitados.map((inv, i) => [i, ...inv]));
