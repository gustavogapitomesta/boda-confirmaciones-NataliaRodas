  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-action { padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; border: 1.5px solid var(--rose); }
  .btn-yes { background: var(--rose); color: white; }
  .btn-no { background: transparent; color: var(--rose); }
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
