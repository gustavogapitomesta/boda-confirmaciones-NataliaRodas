<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mensajes Boda Mayra & Kevin 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #b5294e;
    --rose-light: #f9e8ee;
    --rose-mid: #e8a0b8;
    --gold: #c9a96e;
    --dark: #1a1018;
    --muted: #7a6570;
    --bg: #fdf8f5;
    --card: #ffffff;
    --border: #f0e0e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--dark);
    padding: 40px 20px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(181,41,78,0.25) 0%, transparent 65%),
                radial-gradient(ellipse at 80% 30%, rgba(201,169,110,0.15) 0%, transparent 55%);
    pointer-events: none;
  }
  .header-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    position: relative;
  }
  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 600;
    color: #fff;
    line-height: 1.15;
    position: relative;
  }
  .header-title em {
    font-style: italic;
    color: var(--rose-mid);
  }
  .header-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    margin-top: 10px;
    position: relative;
    font-weight: 300;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(181,41,78,0.2);
    border: 1px solid rgba(181,41,78,0.35);
    color: var(--rose-mid);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 20px;
    margin-top: 16px;
    position: relative;
  }

  /* Search */
  .search-wrap {
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .search-box {
    width: 100%;
    padding: 11px 16px 11px 40px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: var(--card);
    color: var(--dark);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--rose-mid); }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
  }
  .count-pill {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 8px 0 0;
    font-weight: 400;
  }

  /* Cards */
  .list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .card:active { box-shadow: 0 2px 16px rgba(181,41,78,0.1); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--rose-light);
    background: var(--rose-light);
    gap: 10px;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-num {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 2px;
  }
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .meta-pill {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .meta-pill.pases {
    background: var(--rose);
    color: white;
    border-color: var(--rose);
    font-weight: 500;
  }

  .card-body {
    padding: 16px;
  }
  .msg-preview {
    font-size: 13px;
    line-height: 1.65;
    color: var(--dark);
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  /* Copy button */
  .btn-copy {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: var(--rose);
    color: white;
    border: none;
    border-radius: 0 0 18px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-appearance: none;
    letter-spacing: 0.3px;
  }
  .btn-copy:active { background: #8f1e3a; }
  .btn-copy.copied {
    background: #1a7a4a;
  }
  .btn-copy.copied::before { content: '✓  '; }

  /* Divider */
  .ornament {
    text-align: center;
    color: var(--rose-mid);
    font-size: 18px;
    opacity: 0.5;
    margin: 4px 0 -4px;
    letter-spacing: 8px;
  }

  .hidden { display: none !important; }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-state span { font-size: 32px; display: block; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <p class="header-eyebrow">Wedding Planner · Natalia Rodas</p>
  <h1 class="header-title">Mayra <em>&</em> Kevin<br>💌</h1>
  <p class="header-sub">Sábado 28 de marzo de 2026 · Colán, Piura</p>
  <div class="header-badge">56 invitados · Confirmar antes del 22 de marzo</div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-box" type="search" placeholder="Buscar invitado..." oninput="filtrar(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
  <div class="count-pill" id="count-label">56 mensajes listos para enviar</div>
</div>

<div class="list" id="lista"></div>

<script>
const ENLACE = '[enlace de invitación virtual]';

const invitados = [
  ['Gustavo Igreda y familia','995242424',3],
  ['Manuel Igreda y Pareja','998990835',2],
  ['Jackeline Valer y Familia','932287000',3],
  ['Brayan Acosta y Pareja','977744614',2],
  ['Kelly Raymundo','992205439',2],
  ['Lizeth Raymundo y familia','969813773',2],
  ['Elvira Maravi','963606271',4],
  ['Rosa Leon y familia','957977238',3],
  ['Rosaura Cardenas','948163051',1],
  ['Cesar Valer y familia','922456230',2],
  ['Silvia Valer y familia','982059402',2],
  ['Sonia Valer y familia','967663644',2],
  ['Roberto Valer y familia','941104795',2],
  ['Luis Valer y familia','960745328',2],
  ['Julio Rios y familia','991496661',2],
  ['Rubi Valverde','+34 673263023',1],
  ['Jaime Loayza y familia','927936858',3],
  ['Daniel Loayza','960710051',2],
  ['Carolina Loayza','997719746',2],
  ['Martha Raymundo','963906619',1],
  ['Luis Loayza','920767840',1],
  ['Julio Loayza','924882660',1],
  ['Brandon Cayetano y Esposa','945086322',2],
  ['Sofia Peña','933872149',1],
  ['Julio Mejia y familia','994726504',2],
  ['Daniel Rojas','961780768',2],
  ['Piero Rios','999883121',1],
  ['Evelyn Sanjinez','953918855',1],
  ['Sarita Santillan','945811878',1],
  ['Claudia Avendaño','961622017',1],
  ['Jorge Quintana','945599958',2],
  ['David Huaman','989517304',1],
  ['Manuel Travezaño','934686093',2],
  ['Ronald Terreros','923172322',2],
  ['Jessica Lopez','978992223',1],
  ['Jhoel Quispe','921358077',1],
  ['Sandra Sancarranco','969955328',2],
  ['Jose Ma San','965358944',2],
  ['Alex Calderon','987784006',2],
  ['Lin Galvez','949997560',2],
  ['Juan Carlos','956385929',2],
  ['Ivan Agapito','962924837',2],
  ['Kate Huaman','965362460',2],
  ['Maria Miyasiro','976489719',2],
  ['Augusto Lopez','943466005',2],
  ['Junior Martinez','969320597',2],
  ['Kevin Cabello','937417368',2],
  ['Isabel','958992323',1],
  ['Sandra Florez','934401979',2],
  ['Roger Quispe y Familia','962622163',2],
  ['Miguel Espinoza','957942363',2],
  ['Liz Claudio','992991077',2],
  ['Cory Calero','998827736',2],
  ['Luis Valdivia','966160030',2],
  ['Freddy Vara','957345001',2],
  ['Jessela Avila','948018789',2],
];

function primerNombre(nombre) {
  return nombre.split(' ')[0];
}

function pasesTexto(p) {
  return p === 1 ? '1 pase' : `${p} pases`;
}

function generarMensaje(nombre, pases) {
  return `Hola, ${primerNombre(nombre)} 🤍

Te escribe *Natalia Rodas*, wedding planner de Mayra & Kevin.

En nombre de los novios, me complace escribirte personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 28 de marzo de 2026
📍 Colán, Piura

Mayra y Kevin han reservado *${pasesTexto(pases)}* exclusivamente para ti — porque no imaginan este momento sin tu presencia.

A continuación te compartimos la invitación oficial 💌
👉 ${ENLACE}

Te pedimos gentilmente confirmar tu asistencia antes del *22 de marzo*, respondiendo *SÍ* o *NO* a este mensaje.

Con cariño,
*Natalia Rodas*
_Wedding Planner · Boda Mayra & Kevin_`;
}

function copiar(idx, btn) {
  const [nombre,, pases] = invitados[idx];
  const texto = generarMensaje(nombre, pases);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => confirmarCopia(btn));
  } else {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); confirmarCopia(btn); } catch(e){}
    document.body.removeChild(ta);
  }
}

function confirmarCopia(btn) {
  btn.classList.add('copied');
  btn.textContent = '✓  ¡Copiado! Pega en WhatsApp';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.textContent = '📋  Copiar mensaje';
  }, 2500);
}

function renderCards(lista) {
  const container = document.getElementById('lista');
  const label = document.getElementById('count-label');

  if (lista.length === 0) {
    container.innerHTML = '<div class="empty-state"><span>🔍</span>No se encontró ese invitado</div>';
    label.textContent = 'Sin resultados';
    return;
  }

  label.textContent = `${lista.length} mensaje${lista.length > 1 ? 's' : ''} encontrado${lista.length > 1 ? 's' : ''}`;

  container.innerHTML = lista.map(([idx, nombre, celular, pases]) => {
    const msg = generarMensaje(nombre, pases);
    return `
    <div class="card" id="card-${idx}">
      <div class="card-header">
        <div class="card-info">
          <div class="card-num">Invitado ${idx + 1}</div>
          <div class="card-name">${nombre}</div>
          <div class="card-meta">
            <span class="meta-pill">📱 ${celular}</span>
            <span class="meta-pill pases">🎟 ${pasesTexto(pases)}</span>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="msg-preview">${msg.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      </div>
      <button class="btn-copy" onclick="copiar(${idx}, this)">📋&nbsp; Copiar mensaje</button>
    </div>`;
  }).join('<div class="ornament">· · ·</div>');
}

function filtrar(q) {
  const term = q.trim().toLowerCase();
  const filtrados = invitados
    .map((inv, i) => [i, ...inv])
    .filter(([, nombre]) => nombre.toLowerCase().includes(term));
  renderCards(filtrados);
}

// Initial render
renderCards(invitados.map((inv, i) => [i, ...inv]));
</script>
</body>
</html>
