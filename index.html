<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Natalia - Solución Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #c9a96e; margin-bottom: 5px; }
        .status { font-size: 11px; margin-bottom: 20px; padding: 8px; border-radius: 5px; font-weight: bold; }
        .loading { background: #fff3cd; color: #856404; }
        .ready { background: #d4edda; color: #155724; }
        label { display: block; text-align: left; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #555; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; background: #fafafa; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; background: #25d366; color: white; }
        #preview { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; text-align: left; font-size: 12px; display: none; border: 1px solid #eee; white-space: pre-wrap; color: #333; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Natalia</h2>
    <div id="status" class="status loading">Sincronizando invitados...</div>

    <label>Selecciona al invitado:</label>
    <select id="listaInvitados" onchange="generarVistaPrevia()">
        <option value="">Cargando nombres...</option>
    </select>

    <div id="preview"></div>
    <button onclick="enviarWhatsApp()">ENVIAR POR WHATSAPP</button>
</div>

<script>
    // PEGA AQUÍ EL LINK DE PUBLICACIÓN QUE TERMINA EN output=csv
    const URL_EXCEL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNMqkqlD9u6EmL2X-sxuUYmd_Wwgb0qhQcUjWH5WTy7dEhnLG3tU8jnrjboG6TtkJpDZRU6r1vlDP8/pub?output=csv';

    let baseDatosInvitados = [];

    async function obtenerDatos() {
        try {
            const res = await fetch(URL_EXCEL + '&nocache=' + new Date().getTime());
            const csvText = await res.text();
            
            // Separar filas y omitir la primera (cabecera)
            const filas = csvText.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
            const select = document.getElementById('listaInvitados');
            select.innerHTML = '<option value="">-- Seleccionar Invitado --</option>';

            filas.forEach(fila => {
                // Dividir por comas, pero considerando que puede haber comas dentro de comillas
                const columnas = fila.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                
                if (columnas && columnas.length >= 4) {
                    const nombre = columnas[1].replace(/"/g, "").trim(); 
                    const pases = columnas[3].replace(/"/g, "").trim();  
                    
                    if (nombre) {
                        baseDatosInvitados.push({ nombre, pases });
                        const opt = document.createElement('option');
                        opt.value = nombre;
                        opt.textContent = `${nombre} (${pases} pases)`;
                        select.appendChild(opt);
                    }
                }
            });

            if (baseDatosInvitados.length > 0) {
                document.getElementById('status').innerText = `✅ ${baseDatosInvitados.length} invitados cargados`;
                document.getElementById('status').className = "status ready";
            }
        } catch (err) {
            document.getElementById('status').innerText = "❌ Error: Revisa el enlace del Excel";
        }
    }

    function generarVistaPrevia() {
        const seleccionado = document.getElementById('listaInvitados').value;
        const invitado = baseDatosInvitados.find(i => i.nombre === seleccionado);
        const box = document.getElementById('preview');

        if (invitado) {
            const nombreURL = encodeURIComponent(invitado.nombre.split(' ').join('_'));
            const linkFinal = `https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html?id=${nombreURL}&pases=${invitado.pases}`;

            const mensaje = `Hola, estimado(a) *${invitado.nombre.toUpperCase()}* 🤍

Te escribe *Natalia Rodas*, wedding planner de María Claudia & Gustavo.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 02 de Mayo del 2026
📍 Pachacamac, Lima

María Claudia & Gustavo han reservado *${invitado.pases} pase(s)* exclusivamente para ti porque no imaginan este momento sin tu presencia.

📌 Ubicación de Iglesia
https://maps.app.goo.gl/kR2rTp3kRs45y59UA

📌 Ubicación de la fiesta: Fundo Pachacamac
https://maps.app.goo.gl/v3uQQjzvwyyBB6nJA

*_Te pedimos gentilmente confirmar tu asistencia ingresando al link hasta el día domingo 12 de abril:_*
${linkFinal}

Con cariño,
*Natalia Rodas*
Wedding Planner`;
            
            box.innerText = mensaje;
            box.style.display = "block";
            return mensaje;
        }
        box.style.display = "none";
        return null;
    }

    function enviarWhatsApp() {
        const msg = generarVistaPrevia();
        if (msg) {
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg));
        } else {
            alert("Por favor selecciona un invitado");
        }
    }

    obtenerDatos();
</script>
</body>
</html>
