<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Invitaciones - Natalia Rodas</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; padding: 20px; background-color: #f4f4f4; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #c9a96e; color: white; font-weight: bold; cursor: pointer; border: none; }
        #mensajeFinal { background: #e9e9e9; padding: 15px; border-radius: 5px; margin-top: 20px; white-space: pre-wrap; text-align: left; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Natalia Rodas</h2>
    <p>Generador de Mensajes Personalizados</p>
    
    <input type="text" id="nombreInvitado" placeholder="Nombre completo del invitado">
    <input type="number" id="numPases" placeholder="Número de pases" min="1">
    
    <button onclick="generarMensaje()">GENERAR MENSAJE PARA WHATSAPP</button>

    <div id="mensajeFinal" style="display:none;"></div>
    <button id="btnWhatsApp" style="display:none; background-color: #25d366;">ENVIAR POR WHATSAPP</button>
</div>

<script>
function generarMensaje() {
    // 1. Capturamos lo que Natalia escribe
    const nombre = document.getElementById('nombreInvitado').value.trim();
    const pases = document.getElementById('numPases').value;

    if (nombre === "" || pases === "") {
        alert("Por favor, completa el nombre y los pases.");
        return;
    }

    // 2. CREAMOS EL LINK CORRECTO (Aquí estaba el error)
    // Usamos el nombre para el "id" y el número para "pases"
    const nombreParaLink = encodeURIComponent(nombre.replace(/ /g, "_"));
    const linkConfirmacion = "https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html?id=" + nombreParaLink + "&pases=" + pases;

    // 3. Redactamos el mensaje tal cual lo pediste
    const mensaje = `Hola, estimado(a) *${nombre.toUpperCase()}* 🤍

Te escribe *Natalia Rodas*, wedding planner de María Claudia & Gustavo.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 02 de Mayo del 2026
📍 Pachacamac, Lima

María Claudia & Gustavo han reservado *${pases} pase(s)* exclusivamente para ti porque no imaginan este momento sin tu presencia.

📌 Ubicación de Iglesia
https://maps.app.goo.gl/kR2rTp3kRs45y59UA

📌 Ubicación de la fiesta: Fundo Pachacamac
https://maps.app.goo.gl/v3uQQjzvwyyBB6nJA

*_Te pedimos gentilmente confirmar tu asistencia ingresando al link hasta el día sábado 11 de abril:_*
${linkConfirmacion}

Con cariño,
*Natalia Rodas*
Wedding Planner`;

    // 4. Mostramos el resultado en pantalla
    const contenedor = document.getElementById('mensajeFinal');
    contenedor.style.display = "block";
    contenedor.innerText = mensaje;

    const btnWA = document.getElementById('btnWhatsApp');
    btnWA.style.display = "block";
    btnWA.onclick = function() {
        window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(mensaje));
    };
}
</script>

</body>
</html>
