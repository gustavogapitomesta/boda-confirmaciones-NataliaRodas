<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Wedding Planner - Jenny & Rafael</title>
    <style>
        :root { --rose: #b5294e; --bg: #fdf8f5; --dark: #1a1018; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .search-box { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; font-size: 16px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        .name { font-weight: bold; font-size: 18px; color: var(--dark); }
        .btn-copy { background: var(--rose); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Gestión de Invitados 📋</h2>
    <input type="text" class="search-box" id="search" placeholder="Buscar invitado..." oninput="filtrar()">
    <div id="lista"></div>

    <script>
        const BASE_URL_INVITADO = "https://tu-usuario.github.io/boda/confirmar.html"; // URL del SEGUNDO HTML
        const invitados = [
            ['Laura Custodio Carbajal', '988750894', 1],
            ['Jorge Custodio Tello', '979287052', 3],
            // ... agregar el resto de la lista aquí
        ];

        function generarMensaje(nombre, pases, index) {
            const nombreSaludo = nombre.split(' ')[0] + " " + (nombre.split(' ')[1] || "");
            const linkConfirmar = `${BASE_URL_INVITADO}?id=${index}`;
            return `Hola, estimado(a) ${nombreSaludo} 🤍\n\nTe escribe Natalia Rodas, wedding planner de Jenny & Rafael. Jenny y Rafael han reservado ${pases} pases para ti.\n\nPor favor, confirma tu asistencia aquí:\n${linkConfirmar}\n\n¡Gracias!`;
        }

        function copiar(idx, btn) {
            const [nombre,, pases] = invitados[idx];
            navigator.clipboard.writeText(generarMensaje(nombre, pases, idx));
            btn.innerText = "✅ ¡Copiado!";
            setTimeout(() => btn.innerText = "📋 Copiar para WhatsApp", 2000);
        }

        function filtrar() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = invitados.map((inv, i) => [i, ...inv]).filter(inv => inv[1].toLowerCase().includes(q));
            document.getElementById('lista').innerHTML = filtered.map(inv => `
                <div class="card">
                    <div class="name">${inv[1]}</div>
                    <button class="btn-copy" onclick="copiar(${inv[0]}, this)">📋 Copiar para WhatsApp</button>
                </div>
            `).join('');
        }
        filtrar();
    </script>
</body>
</html>
