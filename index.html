<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Natalia - Selección Automática</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #c9a96e; margin-bottom: 5px; }
        .status { font-size: 11px; margin-bottom: 20px; padding: 5px; border-radius: 5px; }
        .loading { background: #fff3cd; color: #856404; }
        .ready { background: #d4edda; color: #155724; }
        
        label { display: block; text-align: left; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #555; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; background: #fafafa; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-wa { background: #25d366; color: white; }
        .btn-wa:hover { background: #1ebe57; }
        
        #preview { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; text-align: left; font-size: 13px; display: none; border: 1px solid #eee; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Natalia</h2>
    <div id="status" class="status loading">Conectando con el Excel de los novios...</div>

    <label>Busca y selecciona al invitado:</label>
    <select id="listaInvitados" onchange="generarVistaPrevia()">
        <option value="">Cargando invitados...</option>
    </select>

    <div id="preview"></div>

    <button class="btn-wa" onclick="enviarWhatsApp()">ENVIAR POR WHATSAPP</button>
</div>

<script>
    // 1. REEMPLAZA ESTO CON TU LINK DE GOOGLE SHEETS (PUBLICADO COMO CSV)
    const URL_EXCEL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNMqkqlD9u6EmL2X-sxuUYmd_Wwgb0qhQcUjWH5WTy7dEhnLG3tU8jnrjboG6TtkJpDZRU6r1vlDP8/pub?output=csv';

    let baseDatosInvitados = [];

    async function obtenerDatos() {
        try {
            const res = await fetch(URL_EXCEL);
            const csvText = await res.text();
            
            // Procesar filas (omitimos la primera que es el encabezado)
            const filas = csvText.split(/\r?\n/).slice(1);
            const select = document.getElementById('listaInvitados');
            select.innerHTML = '<option value="">-- Toca para buscar --</option>';

            filas.forEach(fila => {
                // Dividir por comas (formato CSV estándar)
                const columnas = fila.split(',');
                
                if (columnas.length >= 4) {
                    const nombre = columnas[1].trim(); // Columna B: RÓTULO
                    const pases = columnas[3].trim();  // Columna D: Nº DE PASES
                    
                    if (nombre && nombre !== "") {
                        baseDatosInvitados.push({ nombre, pases });
                        const opt = document.createElement('option');
                        opt.value = nombre;
                        opt.textContent = `${nombre} (${pases} pases)`;
                        select.appendChild(opt);
                    }
                }
            });

            document.getElementById('status').innerText = "✅ Lista cargada correctamente";
            document.getElementById('status').className = "status ready";

        } catch (err) {
            document.getElementById('status').innerText = "❌ Error al conectar con el Excel";
            console.error(err);
        }
    }

    function generarVistaPrevia() {
        const seleccionado = document.getElementById('listaInvitados').value;
        const invitado = baseDatosInvitados.find(i => i.nombre === seleccionado);
        const box = document.getElementById('preview');

        if (invitado) {
            const nombreParaLink = encodeURIComponent(invitado.nombre.replace(/ /g, "_"));
            const linkFinal = `https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html?id=${nombreParaLink}&pases=${invitado.pases}`;

            // Mensaje que verá Natalia antes de enviar
            const texto = `Hola, estimado(a) *${invitado.nombre.toUpperCase()}* 🤍\n\nTe escribe Natalia Rodas, wedding planner de María Claudia & Gustavo. Es un gusto saludarte.\n\nLos novios han reservado *${invitado.pases} pase(s)* para ti.\n\nConfirmar aquí: ${linkFinal}`;
            
            box.innerText = texto;
            box.style.display = "block";
            return texto;
        }
        box.style.display = "none";
        return null;
    }

    function enviarWhatsApp() {
        const msg = generarVistaPrevia();
        if (!msg) {
            alert("Selecciona un invitado primero");
            return;
        }
        window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg));
    }

    // Iniciar carga al abrir la página
    obtenerDatos();
</script>

</body>
</html>
