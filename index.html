<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Natalia Rodas - Wedding Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #c9a96e; text-align: center; margin-bottom: 25px; }
        label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-generate { background-color: #c9a96e; color: white; margin-bottom: 10px; }
        .btn-generate:hover { background-color: #b3935b; }
        .btn-whatsapp { background-color: #25d366; color: white; display: none; }
        #resultado { background: #f1f1f1; padding: 20px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; font-size: 14px; display: none; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Natalia Rodas</h2>
    
    <label>Nombre del Invitado:</label>
    <input type="text" id="nombreInvitado" placeholder="Ej: DAYANA CCAMA LA TORRE">
    
    <label>Número de Pases:</label>
    <input type="number" id="numPases" placeholder="Ej: 1" min="1">
    
    <button class="btn-generate" onclick="crearMensaje()">GENERAR MENSAJE</button>
    
    <div id="resultado"></div>
    <button id="btnWA" class="btn-whatsapp" onclick="enviarWhatsApp()">ENVIAR POR WHATSAPP</button>
</div>

<script>
let mensajeGlobal = "";

function crearMensaje() {
    // 1. Obtener valores de los cuadros de texto
    const nombre = document.getElementById('nombreInvitado').value.trim();
    const pases = document.getElementById('numPases').value;

    if (!nombre || !pases) {
        alert("Por favor, ingresa el nombre y el número de pases.");
        return;
    }

    // 2. CORRECCIÓN DEL LINK (La solución definitiva)
    // Convertimos espacios en guiones bajos para que el link no se rompa
    const nombreFormateado = encodeURIComponent(nombre.replace(/ /g, "_"));
    
    // Armamos el link usando la estructura correcta: id=NOMBRE&pases=NUMERO
    const linkConfirmacion = `https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html?id=${nombreFormateado}&pases=${pases}`;

    // 3. Redacción del mensaje solicitado
    mensajeGlobal = `Hola, estimado(a) *${nombre.toUpperCase()}* 🤍

Te escribe *Natalia Rodas*, wedding planner de María Claudia & Gustavo.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 02 de Mayo del 2026
📍 Pachacamac, Lima

María Claudia & Gustavo han reservado *${pases} pase(s)* exclusivamente para ti porque no imaginan este momento sin tu presencia.

📌 Ubicación de Iglesia
https://maps.app.goo.gl/kR2rTp3kRs45y59UA

📌 Ubicación de la fiesta: Fundo Pachacamac
https://maps.app.goo.gl/v3uQQjzvwyyBB6nJA

*_Te pedimos gentilmente confirmar tu asistencia ingresando al link hasta el día sábado 11 de abril:_*
${linkConfirmacion}

Con cariño,
*Natalia Rodas*
Wedding Planner`;

    // 4. Mostrar en pantalla
    document.getElementById('resultado').innerText = mensajeGlobal;
    document.getElementById('resultado').style.display = "block";
    document.getElementById('btnWA').style.display = "block";
}

function enviarWhatsApp() {
    const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensajeGlobal);
    window.open(url, '_blank');
}
</script>

</body>
</html>
