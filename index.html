<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Natalia - Mª Claudia & Gustavo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a96e; --dark: #1a1018; --bg: #fdf8f5; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--dark); padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--dark); }
        .wp-tag { font-size: 10px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; font-weight: bold; }
        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .guest-name { font-weight: 600; font-size: 16px; display: block; margin-bottom: 5px; }
        .guest-meta { font-size: 13px; color: #666; margin-bottom: 15px; }
        .btn-send { background: #1a7a4a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .btn-send:hover { background: #125a36; }
        .btn-send.success { background: #0c5632; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="wp-tag">Wedding Planner · Natalia Rodas</div>
        <h1>Mª Claudia & Gustavo</h1>
    </header>

    <input type="text" class="search-box" id="searchInput" placeholder="Buscar nombre del invitado..." oninput="filtrar()">
    <div id="listaInvitados"></div>
</div>

<script>
// RUTA DE TU WEB DE CONFIRMACIÓN EN GITHUB
const URL_WEB = "https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html";

// BASE DE DATOS DE INVITADOS
const invitados = [
    ['JOSE MARQUEZ SANCHEZ','998292682',1],['JUAN MARQUEZ SANCHEZ','946533027',2],['DAYANA CCAMA LA TORRE','981450581',1],['MARIA LA TORRE','987772390',2],['SEBASTIAN LINGUA','+56982189254',2],['ANDREA BALDERAS','+528441852632',2],['SHARON GRANADOS','963719007',2],['RUTH PARIONA','973957957',2],['MARIEL ESPINOZA','999023870',2],['DIEGO CONDORI','990224425',1],['JOSSELY PRETELL','907768848',1],['EDUARDO URBINA','985458135',1]
    // ... Agregar el resto de la lista aquí
];

function generarMensaje(nombre, pases, id) {
    const link = `${URL_WEB}?id=${id}&pases=${pases}`;
    const nPases = pases === 1 ? "1 pase" : `${pases} pases`;
    const variante = Math.floor(Math.random() * 3);
    
    // Modelos validados
    const intros = [
        `Hola, estimado(a) *${nombre}* 🤍\n\nTe escribe *Natalia Rodas*, wedding planner de María Claudia & Gustavo.`,
        `Hola, estimado(a) *${nombre}* 🤍\n\nEs un gusto saludarte, soy *Natalia Rodas*, wedding planner de María Claudia & Gustavo.`,
        `Hola, estimado(a) *${nombre}* 🤍\n\nRecibe un cordial saludo de *Natalia Rodas*, wedding planner de María Claudia & Gustavo.`
    ];

    return `${intros[variante]}

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 02 de Mayo del 2026
📍 Pachacamac, Lima

María Claudia & Gustavo han reservado *${nPases}* exclusivamente para ti porque no imaginan este momento sin tu presencia.

📌 Ubicación de Iglesia
https://maps.app.goo.gl/kR2rTp3kRs45y59UA

📌 Ubicación de la fiesta: Fundo Pachacamac
https://maps.app.goo.gl/v3uQQjzvwyyBB6nJA

*_Te pedimos gentilmente confirmar tu asistencia ingresando al link hasta el día sábado 11 de abril:_*
${link}

Con cariño,
*Natalia Rodas*
Wedding Planner`;
}

function enviarWhatsApp(idx, btn) {
    const [nombre, tel, pases] = invitados[idx];
    const texto = generarMensaje(nombre, pases, idx);
    const url = `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
    btn.innerText = "✅ Mensaje Abierto";
    btn.classList.add('success');
}

function filtrar() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const div = document.getElementById('listaInvitados');
    div.innerHTML = invitados.map((inv, idx) => {
        if (!inv[0].toLowerCase().includes(q)) return '';
        return `<div class="card">
            <span class="guest-name">${inv[0]}</span>
            <div class="guest-meta">📱 ${inv[1]} | 🎟️ ${inv[2]} pases</div>
            <button class="btn-send" onclick="enviarWhatsApp(${idx}, this)">🚀 Enviar WhatsApp</button>
        </div>`;
    }).join('');
}
filtrar();
</script>
</body>
</html>
