function formatearSaludo(txt) {
    const p = txt.trim().split(/\s+/);
    const nombre = p[0] || "";
    const apellido = p[1] || "";
    return (nombre + " " + apellido).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function generarMensaje(nombre, pases) {
    const nombreWP = formatearSaludo(nombre);
    const nPases = pases === 1 ? "1 pase" : `${pases} pases`;
    
    return `Hola, estimado(a) *${nombreWP}* 🤍

Te escribe *Natalia Rodas*, wedding planner de Jenny & Rafael.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 18 de abril de 2026
📍 Lambayeque, Chiclayo

Jenny y Rafael han reservado *${nPases}* exclusivamente para ti — porque no imaginan este momento sin tu presencia.

📌 Ubicación de Iglesia San Pedro - Lambayeque:
https://maps.app.goo.gl/Qw7gEYNtRYWScrUm6

📌 Ubicación de la recepción - Jockey Club del Peru - Chiclayo:
https://maps.app.goo.gl/YnXvxNKYMCtDsynC8

Te pedimos gentilmente confirmar tu asistencia hasta el día miércoles 08 de abril, ingresando al siguiente link:
${LINK_BITLY}

Con cariño,
*Natalia Rodas*
_Wedding Planner · Boda Jenny & Rafael_`;
}

function copiar(idx, btn) {
    const [nombre,, pases] = invitados[idx];
    const texto = generarMensaje(nombre, pases);
    
    navigator.clipboard.writeText(texto).then(() => {
        btn.classList.add('success');
        btn.innerText = '✅ ¡Mensaje Copiado!';
        setTimeout(() => {
            btn.classList.remove('success');
            btn.innerText = '📋 Copiar para WhatsApp';
        }, 2000);
    });
}

function filtrar() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const lista = invitados
        .map((inv, index) => ({...inv, id: index}))
        .filter(inv => inv[0].toLowerCase().includes(q));
    
    const div = document.getElementById('listaInvitados');
    div.innerHTML = lista.map(inv => `
        <div class="card">
            <span class="guest-name">${inv[0]}</span>
            <div class="guest-meta">📱 ${inv[1]} | 🎟 ${inv[2]} pase(s)</div>
            <button class="btn-copy" onclick="copiar(${inv.id}, this)">📋 Copiar para WhatsApp</button>

    `).join('');
}
