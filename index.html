<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Natalia - Automatizado</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #c9a96e; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #c9a96e; color: white; font-weight: bold; border: none; cursor: pointer; }
        #mensajePreview { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; font-size: 13px; white-space: pre-wrap; display: none; border: 1px solid #eee; }
        .status { font-size: 12px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel Natalia Rodas</h2>
    <p class="status" id="loadingStatus">Cargando lista de invitados...</p>
    
    <label>Selecciona al Invitado:</label>
    <select id="listaInvitados" onchange="previsualizar()">
        <option value="">Cargando nombres...</option>
    </select>

    <button onclick="enviarWhatsApp()" style="background-color: #25d366;">ENVIAR POR WHATSAPP</button>

    <div id="mensajePreview"></div>
</div>

<script>
    // PEGA AQUÍ EL LINK CSV QUE COPIASTE EN EL PASO 1
    const URL_CSV = 'TU_LINK_DE_PUBLICACION_CSV_AQUI';
    
    let invitadosData = [];

    // Función para cargar los datos del Excel
    async function cargarExcel() {
        try {
            const response = await fetch(URL_CSV);
            const data = await response.text();
            const filas = data.split('\n').slice(1); // Omitir encabezado

            const select = document.getElementById('listaInvitados');
            select.innerHTML = '<option value="">-- Selecciona un invitado --</option>';

            filas.forEach(fila => {
                const columnas = fila.split(',');
                if (columnas.length >= 4) {
                    // Ajustamos según tu Excel: Col 1: Rótulo, Col 3: Pases
                    const nombre = columnas[1].trim();
                    const pases = columnas[3].trim();
                    
                    if (nombre) {
                        invitadosData.push({ nombre, pases });
                        let option = document.createElement('option');
                        option.value = nombre;
                        option.text = nombre + " (" + pases + " pases)";
                        select.appendChild(option);
                    }
                }
            });
            document.getElementById('loadingStatus').innerText = "✅ Lista de invitados actualizada";
        } catch (error) {
            document.getElementById('loadingStatus').innerText = "❌ Error al cargar el Excel";
            console.error(error);
        }
    }

    function previsualizar() {
        const nombreSel = document.getElementById('listaInvitados').value;
        const invitado = invitadosData.find(i => i.nombre === nombreSel);
        const preview = document.getElementById('mensajePreview');

        if (invitado) {
            const nombreLink = encodeURIComponent(invitado.nombre.replace(/ /g, "_"));
            const linkConfirmar = `https://gustavogapitomesta.github.io/Confirmaciones---Invitados/confirmar.html?id=${nombreLink}&pases=${invitado.pases}`;

            const mensaje = `Hola, estimado(a) *${invitado.nombre.toUpperCase()}* 🤍\n\nTe escribe *Natalia Rodas*, wedding planner de María Claudia & Gustavo...\n\nMaría Claudia & Gustavo han reservado *${invitado.pases} pase(s)* exclusivamente para ti...\n\n*_Confirma aquí:_* \n${linkConfirmar}`;
            
            preview.innerText = mensaje;
            preview.style.display = "block";
            return mensaje;
        }
        preview.style.display = "none";
    }

    function enviarWhatsApp() {
        const mensaje = previsualizar();
        if (mensaje) {
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(mensaje));
        } else {
            alert("Por favor selecciona un invitado primero");
        }
    }

    // Iniciar carga
    cargarExcel();
</script>

</body>
</html>
