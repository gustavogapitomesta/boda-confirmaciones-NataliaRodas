  .header { background: var(--dark); padding: 40px 20px 32px; text-align: center; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, rgba(181,41,78,0.25) 0%, transparent 65%), radial-gradient(ellipse at 80% 30%, rgba(201,169,110,0.15) 0%, transparent 55%); pointer-events: none; }
  .header-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; position: relative; }
  .header-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: #fff; line-height: 1.15; position: relative; }
  .header-title em { font-style: italic; color: var(--rose-mid); }
  .header-sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 10px; position: relative; font-weight: 300; }
  .header-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(181,41,78,0.2); border: 1px solid rgba(181,41,78,0.35); color: var(--rose-mid); font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; margin-top: 16px; position: relative; }
  .search-wrap { padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); }
  .search-box { width: 100%; padding: 11px 16px 11px 40px; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--card); color: var(--dark); outline: none; -webkit-appearance: none; transition: border-color 0.2s; }
  .search-box:focus { border-color: var(--rose-mid); }
  .search-icon { position: absolute; left: 28px; top: 26px; color: var(--muted); font-size: 15px; pointer-events: none; }
  .count-pill { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 0 0; font-weight: 400; }
  .list { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; transition: box-shadow 0.2s; }
  .card:active { box-shadow: 0 2px 16px rgba(181,41,78,0.1); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--rose-light); background: var(--rose-light); gap: 10px; }
  .card-info { flex: 1; min-width: 0; }
  .card-num { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--rose); margin-bottom: 2px; }
  .card-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .meta-pill { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; font-size: 11px; color: var(--muted); }
  .meta-pill.pases { background: var(--rose); color: white; border-color: var(--rose); font-weight: 500; }
  .card-body { padding: 16px; }
  .msg-preview { font-size: 13px; line-height: 1.65; color: var(--dark); white-space: pre-wrap; word-break: break-word; font-family: 'DM Sans', sans-serif; font-weight: 300; }
  .btn-copy { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; background: var(--rose); color: white; border: none; border-radius: 0 0 18px 18px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; -webkit-appearance: none; letter-spacing: 0.3px; }
  .btn-copy:active { background: #8f1e3a; }
  .btn-copy.copied { background: #1a7a4a; }
  .ornament { text-align: center; color: var(--rose-mid); font-size: 18px; opacity: 0.5; margin: 4px 0 -4px; letter-spacing: 8px; }
  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px; }
  .empty-state span { font-size: 32px; display: block; margin-bottom: 12px; }

function nombreCompleto(nombre) {
  const partes = nombre.trim().split(' ');
  return partes.length >= 2 ? partes[0] + ' ' + partes[1] : partes[0];
}
function pasesTexto(p) { return p === 1 ? '1 pase' : `${p} pases`; }

function generarMensaje(nombre, pases) {
  return `Hola, estimado(a) ${nombreCompleto(nombre)} 🤍

Te escribe *Natalia Rodas*, wedding planner de Jenny & Rafael.

En nombre de los novios, me comunico personalmente para confirmar tu lugar en este día tan especial.

📅 Sábado, 18 de abril de 2026
📍 Lambayeque, Chiclayo

Jenny y Rafael han reservado *${pasesTexto(pases)}* exclusivamente para ti — porque no imaginan este momento sin tu presencia.

📌 *Ubicación de Iglesia San Pedro - Lambayeque:*
https://maps.app.goo.gl/Qw7gEYNtRYWScrUm6

📌 *Ubicación de la recepción - Jockey Club del Peru - Chiclayo:*
https://maps.app.goo.gl/YnXvxNKYMCtDsynC8

Te pedimos gentilmente confirmar tu asistencia hasta el día *miércoles 08 de abril*, respondiendo *"Sí confirmo"* o *"No asisto"* a este mensaje.

Con cariño,
*Natalia Rodas*
_Wedding Planner · Boda Jenny & Rafael_`;
}

function copiar(idx, btn) {
  const [nombre,, pases] = invitados[idx];
  const texto = generarMensaje(nombre, pases);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => confirmarCopia(btn));
  } else {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); confirmarCopia(btn); } catch(e){}
    document.body.removeChild(ta);
  }
}

function confirmarCopia(btn) {
  btn.classList.add('copied');
  btn.textContent = '✓  ¡Copiado! Pega en WhatsApp';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋  Copiar mensaje'; }, 2500);
}

function renderCards(lista) {
  const container = document.getElementById('lista');
  const label = document.getElementById('count-label');
  if (lista.length === 0) {
    container.innerHTML = '<div class="empty-state"><span>🔍</span>No se encontró ese invitado</div>';
    label.textContent = 'Sin resultados';
    return;
  }
  label.textContent = `${lista.length} mensaje${lista.length > 1 ? 's' : ''} encontrado${lista.length > 1 ? 's' : ''}`;
  container.innerHTML = lista.map(([idx, nombre, celular, pases]) => {
    const msg = generarMensaje(nombre, pases);
    return `<div class="card" id="card-${idx}">
      <div class="card-header"><div class="card-info">
        <div class="card-num">Invitado ${idx + 1}</div>
        <div class="card-name">${nombre}</div>
        <div class="card-meta">
          <span class="meta-pill">📱 ${celular}</span>
          <span class="meta-pill pases">🎟 ${pasesTexto(pases)}</span>
        </div>
      </div></div>
      <div class="card-body"><div class="msg-preview">${msg.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>
      <button class="btn-copy" onclick="copiar(${idx}, this)">📋  Copiar mensaje</button>
    </div>`;
  }).join('<div class="ornament">· · ·</div>');
}

function filtrar(q) {
  const term = q.trim().toLowerCase();
  renderCards(invitados.map((inv, i) => [i, ...inv]).filter(([,n]) => n.toLowerCase().includes(term)));
}
